<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: #cbd5f5;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: white;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 90vh;
      padding: 20px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 600px;
      margin-bottom: 30px;
      color: #94a3b8;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #475569;
      color: #e2e8f0;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #1e293b;
      color: #64748b;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 32px;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Brand</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </div>
    <button class="btn btn-primary">Get Started</button>
  </nav>

  <section class="hero">
    <h1>Build Something Modern</h1>
    <p>A clean, minimal landing page you can actually use. Fast, responsive, and designed to look sharp.</p>
    <div class="hero-buttons">
      <button class="btn btn-primary">Start Now</button>
      <button class="btn btn-secondary">Learn More</button>
    </div>
  </section>

  <footer>
    © 2026 Your Brand. All rights reserved.
  </footer>

</body>
</html>
