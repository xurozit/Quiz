<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Quiz — Amines & Biomolecules</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:2rem;min-height:100vh}
  .container{max-width:680px;margin:0 auto}
  h1{font-size:18px;font-weight:500;margin-bottom:1.5rem;color:#1a1a1a}
  .progress-bar{height:4px;background:#e0ddd6;border-radius:2px;margin-bottom:1rem}
  .progress-fill{height:100%;background:#7F77DD;border-radius:2px;transition:width 0.4s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:#888780;margin-bottom:1.5rem}
  .question-card{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
  .q-label{font-size:11px;font-weight:500;color:#7F77DD;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.05em}
  .q-text{font-size:15px;line-height:1.6;margin-bottom:1.25rem}
  .options{display:flex;flex-direction:column;gap:8px}
  .opt-btn{text-align:left;background:#f5f4f0;border:0.5px solid #d3d1c7;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;color:#1a1a1a;transition:background 0.15s,border-color 0.15s;line-height:1.5;font-family:inherit}
  .opt-btn:hover:not(:disabled){background:#e8e6e0;border-color:#b4b2a9}
  .opt-btn.correct{background:#EAF3DE;border-color:#639922;color:#27500A}
  .opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
  .feedback{margin-top:1rem;font-size:13px;padding:10px 14px;border-radius:8px;line-height:1.5}
  .feedback.correct{background:#EAF3DE;color:#27500A}
  .feedback.wrong{background:#FCEBEB;color:#501313}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem}
  .nav-btn{padding:8px 20px;border-radius:8px;border:0.5px solid #b4b2a9;background:transparent;cursor:pointer;font-size:14px;color:#1a1a1a;font-family:inherit}
  .nav-btn:hover{background:#e8e6e0}
  .nav-btn.primary{background:#534AB7;border-color:#534AB7;color:#EEEDFE}
  .nav-btn.primary:hover{background:#3C3489}
  .score-card{text-align:center;padding:2rem}
  .score-num{font-size:48px;font-weight:500;color:#534AB7;line-height:1}
  .score-label{font-size:14px;color:#888780;margin-top:6px}
  .score-msg{font-size:15px;margin:1.5rem 0;line-height:1.6}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:8px;margin-bottom:0.75rem;background:#EEEDFE;color:#3C3489;font-weight:500}
</style>
</head>
<body>
<div class="container">
  <h1>Chemistry Quiz — Amines &amp; Biomolecules</h1>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="meta">
    <span id="q-counter">Question 1 of 12</span>
    <span id="score-live">Score: 0</span>
  </div>
  <div id="quiz-area"></div>
</div>

<script>
const qs = [
  {
    ch:"Unit 9 — Amines",
    q:"What is the hybridisation of the nitrogen atom in amines?",
    opts:["sp","sp²","sp³","sp³d"],
    ans:2,
    exp:"Nitrogen in amines is sp³ hybridised, giving amines a pyramidal geometry. The fourth sp³ orbital holds the lone pair of electrons."
  },
  {
    ch:"Unit 9 — Amines",
    q:"Which of the following processes is called ammonolysis?",
    opts:["Reduction of nitro compounds","Cleavage of C–X bond in alkyl halides by ammonia","Reduction of amides using LiAlH₄","Gabriel phthalimide synthesis"],
    ans:1,
    exp:"Ammonolysis refers to cleavage of the C–X bond in alkyl or benzyl halides by an ammonia molecule, replacing the halogen with an –NH₂ group."
  },
  {
    ch:"Unit 9 — Amines",
    q:"Carbylamine reaction is used as a test for which class of amines?",
    opts:["Primary amines only","Secondary amines only","Tertiary amines only","Both secondary and tertiary amines"],
    ans:0,
    exp:"Only primary aliphatic and aromatic amines give the carbylamine (isocyanide) test when heated with CHCl₃ and alcoholic KOH, producing foul-smelling isocyanides."
  },
  {
    ch:"Unit 9 — Amines",
    q:"Why are aromatic amines weaker bases than aliphatic amines?",
    opts:["The aryl group increases electron density on nitrogen","The lone pair on nitrogen delocalises into the benzene ring, reducing its availability for protonation","Aromatic amines have higher molar mass","Steric hindrance prevents protonation"],
    ans:1,
    exp:"In arylamines like aniline, the –NH₂ lone pair is in conjugation with the benzene ring. This delocalisation makes the lone pair less available for protonation, reducing basicity."
  },
  {
    ch:"Unit 9 — Amines",
    q:"Which method cannot be used to prepare aromatic primary amines?",
    opts:["Reduction of nitro compounds","Reduction of amides","Gabriel phthalimide synthesis","Hoffmann bromamide degradation"],
    ans:2,
    exp:"Gabriel phthalimide synthesis cannot prepare aromatic primary amines because aryl halides do not undergo nucleophilic substitution with the phthalimide anion."
  },
  {
    ch:"Unit 9 — Amines",
    q:"The conversion of primary aromatic amines into diazonium salts is known as:",
    opts:["Coupling reaction","Diazotisation","Sandmeyer reaction","Gattermann reaction"],
    ans:1,
    exp:"Diazotisation is the process by which primary aromatic amines are converted to arenediazonium salts, typically by reaction with NaNO₂ and HCl at 273–278 K."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"Carbohydrates are chemically defined as:",
    opts:["Polymers of amino acids","Optically active polyhydroxy aldehydes or ketones, or compounds that yield such units on hydrolysis","Esters of fatty acids and glycerol","Long-chain polymers of nucleotides"],
    ans:1,
    exp:"Chemically, carbohydrates are optically active polyhydroxy aldehydes or ketones, or compounds that produce such units upon hydrolysis."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"Sucrose is classified as a non-reducing sugar because:",
    opts:["It has no hydroxyl groups","The reducing groups of both glucose and fructose are involved in the glycosidic bond","It is a polysaccharide","It cannot be hydrolysed"],
    ans:1,
    exp:"In sucrose, the glycosidic linkage forms between C1 of α-D-glucose and C2 of β-D-fructose, blocking both reducing groups. Hence no free aldehyde or ketone is available, making it non-reducing."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"Which structural component distinguishes DNA from RNA?",
    opts:["Adenine is present only in DNA","DNA contains 2-deoxyribose sugar; RNA contains ribose sugar","DNA is single-stranded; RNA is double-stranded","Guanine is absent in RNA"],
    ans:1,
    exp:"The sugar in DNA is β-D-2-deoxyribose (no –OH at C2), whereas RNA contains β-D-ribose. Also, DNA uses thymine while RNA uses uracil as the fourth base."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"The peptide bond in proteins is formed between:",
    opts:["Two amino groups","Two carboxyl groups","The –COOH of one amino acid and the –NH₂ of another","The –OH and –NH₂ groups"],
    ans:2,
    exp:"A peptide bond (–CO–NH–) forms when the carboxyl group of one amino acid reacts with the amino group of the next, eliminating water. This links α-amino acids into polypeptide chains."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"Denaturation of a protein destroys which levels of structure?",
    opts:["Primary structure only","Secondary and tertiary structures; primary structure remains intact","All four levels including primary","Only quaternary structure"],
    ans:1,
    exp:"During denaturation (by heat or pH change), hydrogen bonds are disrupted, uncoiling the helix and unfolding the globule. The primary structure (amino acid sequence) remains intact."
  },
  {
    ch:"Unit 10 — Biomolecules",
    q:"Which vitamin deficiency causes scurvy?",
    opts:["Vitamin A","Vitamin B₁","Vitamin C","Vitamin D"],
    ans:2,
    exp:"Vitamin C (ascorbic acid), found in citrus fruits, amla, and green leafy vegetables, prevents scurvy (bleeding gums). It is water-soluble and cannot be stored in the body."
  }
];

let cur=0,score=0,answered=false;

function render(){
  const total=qs.length;
  document.getElementById('prog').style.width=((cur/total)*100)+'%';
  document.getElementById('q-counter').textContent='Question '+(cur+1)+' of '+total;
  document.getElementById('score-live').textContent='Score: '+score;
  answered=false;
  const q=qs[cur];
  document.getElementById('quiz-area').innerHTML=
    '<div class="question-card">'+
      '<div class="badge">'+q.ch+'</div>'+
      '<div class="q-label">Question '+(cur+1)+'</div>'+
      '<div class="q-text">'+q.q+'</div>'+
      '<div class="options" id="opts">'+
        q.opts.map((o,i)=>'<button class="opt-btn" onclick="choose('+i+')" id="opt-'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+
      '</div>'+
      '<div id="feedback" style="display:none"></div>'+
    '</div>'+
    '<div class="nav">'+
      '<span style="font-size:13px;color:#888780">'+(cur+1)+'/'+total+'</span>'+
      '<button class="nav-btn primary" id="next-btn" style="display:none" onclick="next()">'+
        (cur===total-1?'See results →':'Next question →')+
      '</button>'+
    '</div>';
}

function choose(idx){
  if(answered)return;
  answered=true;
  const q=qs[cur];
  if(q.ans===idx)score++;
  q.opts.forEach((_,i)=>{
    const btn=document.getElementById('opt-'+i);
    btn.disabled=true;
    if(i===q.ans)btn.classList.add('correct');
    else if(i===idx&&q.ans!==idx)btn.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.className='feedback '+(q.ans===idx?'correct':'wrong');
  fb.innerHTML=(q.ans===idx?'<strong>Correct.</strong> ':'<strong>Incorrect.</strong> ')+q.exp;
  document.getElementById('next-btn').style.display='inline-block';
  document.getElementById('score-live').textContent='Score: '+score;
}

function next(){
  cur++;
  if(cur>=qs.length)showResult();
  else render();
}

function showResult(){
  const pct=Math.round((score/qs.length)*100);
  let msg='';
  if(pct>=90)msg='Excellent — very strong command of both chapters.';
  else if(pct>=70)msg='Good work. Review the questions you missed and revisit those sections.';
  else msg='Keep revising. Go back to the NCERT chapters and try again.';
  document.getElementById('quiz-area').innerHTML=
    '<div class="question-card score-card">'+
      '<div class="score-num">'+score+'/'+qs.length+'</div>'+
      '<div class="score-label">'+pct+'% correct</div>'+
      '<div class="score-msg">'+msg+'</div>'+
      '<button class="nav-btn primary" onclick="restart()">Restart quiz</button>'+
    '</div>';
  document.getElementById('prog').style.width='100%';
  document.getElementById('q-counter').textContent='Completed';
  document.getElementById('score-live').textContent='Final score: '+score+'/'+qs.length;
}

function restart(){cur=0;score=0;render();}
render();
</script>
</body>
</html>
